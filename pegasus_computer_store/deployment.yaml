apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-web-deployment
  labels:
    app: project-web
spec:
  replicas: 4 # Match the HPA minimum starting total
  selector:
    matchLabels:
      app: project-web
  template:
    metadata:
      labels:
        app: project-web
    spec:
      # CRITICAL: Forces Kubernetes to spread pods evenly across AZs
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: DoNotSchedule # Ensures strict compliance per AZ
          labelSelector:
            matchLabels:
              app: project-web
      containers:
      - name: web-app
        image: yeehimc/ea_project_final:latest
        ports:
        - containerPort: 5000
        # CRITICAL: HPA requires explicit resource requests to measure percentage usage
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      containers:
      - name: web-app
        image: yeehimc/ea_project_final:latest # Replace with your Docker image
        ports:
        - containerPort: 5000 # The port your Flask/Python app listens on
        env:
        - name: DB_HOST
          value: "pegasus-aurora-cluster.cluster-xxxxxx.us-east-1.rds.amazonaws.com"
        - name: DB_NAME
          value: "pegasus"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "SuperSecurePassword2026!" # Replace with your actual password or use Kubernetes Secrets for better security