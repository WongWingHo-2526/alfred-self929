apiVersion: v1
kind: Service
metadata:
  name: project-web-service
spec:
  type: NodePort
  selector:
    app: project-web
  ports:
    - protocol: TCP
      port: 80         # Port exposed inside the cluster
      targetPort: 5000 # Port of your container
      nodePort: 32000  # The exact port exposed on your EC2 instances for the ALB