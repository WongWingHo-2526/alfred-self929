apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: project-web-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-web-deployment  
  minReplicas: 4                  
  maxReplicas: 6                  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75    